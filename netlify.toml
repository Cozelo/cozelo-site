# Cozelo: Netlify configuration
# Static site: no build step, no dependencies. Netlify publishes this folder as-is.

[build]
  publish = "."
  command = ""

# Production builds (main) fail while any page holds a placeholder. Deploy Previews and
# branch deploys use [build] above and are not checked.
[context.production]
  command = "bash scripts/check-placeholders.sh"

# Repo housekeeping (task notes, build scripts) is not part of the site.
[[redirects]]
  from = "/tasks/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Retired pages.
[[redirects]]
  from = "/ai-readiness/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/how-we-work/*"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/why-you-win/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/industries/*"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
